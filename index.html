function nextP(){const l=per(N()-1);const d=new Date(l.en+"T00:00:00Z");d.setUTCDate(d.getUTCDate()+1);const e=new Date(d);e.setUTCMonth(e.getUTCMonth()+1);e.setUTCDate(e.getUTCDate()-1);S.fp.push({st:d.toISOString().slice(0,10),en:e.toISOString().slice(0,10),g:l.g,b:l.b.slice()});save();pi=N()-1;draw()}
const R=n=>(n<0?"-":"")+"Rp "+Math.abs(Math.round(n)).toLocaleString(S.lang=="en"?"en-US":"id-ID");
const U=v=>+String(v).replace(/\D/g,"")||0;
function fmt(e){const n=U(e.value);e.value=n?R(n):""}
const sum=a=>a.reduce((x,y)=>x+(y||0),0);
const dc=i=>S.dc.includes(i);
const sa=a=>a.reduce((x,y,i)=>x+(dc(i)?0:(y||0)),0);
const sA=a=>a.reduce((x,y,k)=>x+(S.da.includes(k)?0:(y||0)),0);
const VP=()=>Array.from({length:N()},(_,i)=>i).filter(i=>!S.dp.includes(i));
const vis=()=>CAT().map((_,k)=>k).filter(k=>!dc(k));
function live(st,en){const a=CAT().map(()=>0);S.tx.forEach(t=>{if(t.d>=st&&t.d<=en)a[t.c]+=t.m});return a}
const PR=i=>i<4?S.hist[i]:i==4?S.p4:S.fp[i-5];
const lbl=(a,b)=>{const f=d=>(+d.slice(8))+" "+(S.lang=="en"?MOE:MO)[+d.slice(5,7)-1];return f(a)+" – "+f(b)+" "+b.slice(0,4)};
function per(i){const p=PR(i);return {...p,n:lbl(p.st,p.en),a:live(p.st,p.en),x:sum(S.inc.filter(t=>t.d>=p.st&&t.d<=p.en).map(t=>t.m)),live:1}}
let tab=0,pi=4;
const T=["Ringkasan","Transaksi","Pemasukan","Aset","Anggaran"];
function nav(){document.getElementById("nav").innerHTML=T.map((x,i)=>`<button class="${i==tab?"on":""}" onclick="tab=${i};draw()">${x}</button>`).join("")}
function chart(){
const V=VP(),w=Math.max(600,V.length*115+20),h=150,bw=22;let mx=1;V.forEach(i=>{const p=per(i);mx=Math.max(mx,p.g,sa(p.a))});
let s=`<svg viewBox="0 0 ${w} ${h+26}" width="${w>600?w:'100%'}" role="img" aria-label="Gaji dan pengeluaran per periode">`;
V.forEach((ix,j)=>{const p=per(ix),x=20+j*115,gh=p.g/mx*h,eh=sa(p.a)/mx*h;
s+=`<rect x="${x}" y="${h-gh}" width="${bw}" height="${gh}" rx="4" fill="var(--ac)"/><rect x="${x+bw+4}" y="${h-eh}" width="${bw}" height="${eh}" rx="4" fill="var(--mu)"/><text x="${x+bw}" y="${h+16}" text-anchor="middle" font-size="12" fill="var(--mu)">${p.n.split(" – ")[0]}</text>`});
return "<div class='sc'>"+s+"</svg></div><div class='note'>Batang terang: gaji. Batang abu-abu: total pengeluaran.</div>"}
const PAL=["#2f9bf5","#ffd93b","#26c6da","#7c5ce6","#ec407a","#ff8a4c","#66bb6a","#8d6e63","#9aa0b4","#f06292","#ffb74d","#4db6ac","#a1887f","#7986cb"];
const catCol=i=>(S.cl&&S.cl[CAT()[i]])||PAL[i%PAL.length];
function setCol(i,v){if(!S.cl)S.cl={};S.cl[CAT()[i]]=v;save();draw()}
const K=n=>{n=Math.abs(Math.round(n));const en=S.lang=="en";return n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace(".",en?".":",")+(en?"M":" jt"):n>=1e3?Math.round(n/1e3)+(en?"K":" rb"):String(n)};
const E=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function donut(segs,cT,cS){const r=68,C=2*Math.PI*r,tt=segs.reduce((x,s)=>x+s.v,0);let off=0;
let s=`<svg viewBox="0 0 200 200" width="190" height="190" role="img" aria-label="${E(cS)}" style="display:block;margin:0 auto"><circle cx="100" cy="100" r="${r}" fill="none" stroke="#e9ebf3" stroke-width="26"/>`;
if(tt>0)segs.forEach(g=>{if(g.v<=0)return;const len=g.v/tt*C,d=Math.max(len-2,.5);s+=`<circle cx="100" cy="100" r="${r}" fill="none" stroke="${g.c}" stroke-width="26" stroke-dasharray="${d} ${C-d}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=len});
return s+`<text x="100" y="99" text-anchor="middle" font-size="17" font-weight="800" style="fill:var(--tx)">${E(cT)}</text><text x="100" y="118" text-anchor="middle" font-size="11" style="fill:var(--mu)">${E(cS)}</text></svg>`}
function chart2(){const V=VP(),w=Math.max(300,V.length*64+20),h=130;let mx=1;const D=V.map(i=>{const p=per(i);return{n:p.n.split(" \u2013 ")[0],inc:p.g+(p.x||0),ex:sa(p.a)}});D.forEach(d=>{mx=Math.max(mx,d.inc,d.ex)});
let s=`<div class="sc"><svg width="${w}" height="${h+34}" viewBox="0 0 ${w} ${h+34}" role="img" aria-label="Statistik per periode">`;
D.forEach((d,j)=>{const x=14+j*64,ih=Math.max(d.inc/mx*h,2),eh=Math.max(d.ex/mx*h,2);s+=`<rect x="${x}" y="${h-ih+8}" width="20" height="${ih}" rx="6" fill="#7c5ce6"/><rect x="${x+24}" y="${h-eh+8}" width="20" height="${eh}" rx="6" fill="#ffd93b"/><text x="${x+22}" y="${h+28}" text-anchor="middle" font-size="11" style="fill:var(--mu)">${E(d.n)}</text>`});
return s+`</svg></div><div class="note">Ungu: pemasukan. Kuning: pengeluaran.</div>`}
function ring(){
const p=per(pi),tot=sa(p.a),bt=sa(p.b),inc=p.g+(p.x||0),sel=inc-tot,aset=sA(ast(pi).ak);
const so=CAT().map((c,i)=>({c,i,a:p.a[i]||0,b:p.b[i]||0})).filter(o=>!dc(o.i)).sort((x,y)=>y.a-x.a);
const col=o=>catCol(o.i),pc=v=>v.toFixed(1).replace(".",S.lang=="en"?".":",")+"%";
let h=`<div class="card bal wide"><div class="k">Total aset</div><div class="v big">${R(aset)}</div><div class="row" style="margin-top:12px;align-items:flex-end"><div><div class="k">Periode</div><div>${E(p.n)}</div></div><div style="text-align:right"><div class="k">Selisih periode</div><div class="${sel<0?"bad":""}">${R(sel)}</div></div></div></div>
<div class="two wide"><div class="card st-e"><div class="ic">\u2212</div><div class="k">Pengeluaran</div><div class="v">${R(-tot)}</div></div><div class="card st-i"><div class="ic">+</div><div class="k">Pemasukan</div><div class="v">+${R(inc)}</div></div></div>
<div class="note wide" style="margin:-6px 2px 14px">Gaji ${R(p.g)} \u00b7 diatur di menu Pemasukan</div>
<div class="card"><b>Pengeluaran teratas</b>${donut(so.filter(o=>o.a>0).map(o=>({v:o.a,c:col(o)})),"Rp "+K(tot),"Total pengeluaran")}<div style="margin-top:14px">`;
so.forEach(o=>{const bp=o.b?Math.min(100,o.a/o.b*100):(o.a?100:0);
h+=`<div class="lg"><span class="dot" style="background:${col(o)}"></span><span style="flex:1;min-width:0">${E(o.c)} <button onclick="delCat(${o.i})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:16px;cursor:pointer">\u00d7</button></span><span style="text-align:right"><span class="${o.b&&o.a>o.b?"bad":""}">${R(o.a)}</span><span class="k" style="display:block;font-size:11px">${pc(tot?o.a/tot*100:0)} \u00b7 dari ${R(o.b)}</span></span></div><div class="bar" style="margin:2px 0 8px"><i class="${o.b&&o.a>o.b?"o":""}" style="width:${bp}%${o.b&&o.a>o.b?"":";background:"+col(o)}"></i></div>`});
h+=`</div></div><div class="card"><b>Statistik per periode</b>${chart2()}</div>`;
const used=bt?tot/bt*100:0;
h+=`<div class="card"><b>Anggaran periode</b>${donut(bt?[{v:Math.min(tot,bt),c:tot>bt?"#e5584a":"#ffd93b"},{v:Math.max(bt-tot,0),c:"#e9ebf3"}]:[],bt?pc(used):"\u2013","terpakai")}<div style="margin-top:12px"><div class="lg"><span class="dot" style="background:#e9ebf3"></span><span style="flex:1">Anggaran</span><span>${R(bt)}</span></div><div class="lg"><span class="dot" style="background:${tot>bt&&bt?"#e5584a":"#ffd93b"}"></span><span style="flex:1">Pengeluaran</span><span>${R(tot)}</span></div><div class="lg"><span class="dot" style="background:#7c5ce6"></span><span style="flex:1">Sisa anggaran</span><span class="${bt-tot<0?"bad":""}">${R(bt-tot)}</span></div></div></div>`;
const inP=t=>t.d>=p.st&&t.d<=p.en;
const rec=S.tx.filter(inP).map(t=>({id:t.id,d:t.d,m:-t.m,n:t.n||CAT()[t.c]||"Transaksi",sub:CAT()[t.c]||"",c:catCol(t.c||0)})).concat(S.inc.filter(inP).map(t=>({id:t.id,d:t.d,m:t.m,n:t.n||"Pemasukan",sub:t.k||"Pemasukan",c:"#7c5ce6"}))).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id).slice(0,6);
h+=`<div class="card"><div class="row" style="align-items:center;margin-bottom:8px"><b>Transaksi terbaru</b><button class="lnk" onclick="tab=1;draw()">Lihat semua</button></div>`+(rec.length?rec.map(t=>`<div class="rt"><span class="ic" style="background:${t.c}33;color:${t.c}">${E((t.n||"?").trim().charAt(0).toUpperCase()||"?")}</span><div style="flex:1;min-width:0"><div style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${E(t.n)}</div><div class="k" style="font-size:11px">${t.d.slice(8)}/${t.d.slice(5,7)}/${t.d.slice(0,4)} \u00b7 ${E(t.sub)}</div></div><div class="${t.m<0?"bad":"good"}" style="font-weight:700">${t.m<0?"-":"+"}${R(Math.abs(t.m))}</div></div>`).join(""):`<div class="note">Belum ada transaksi atau pemasukan di periode ini.</div>`)+`</div>`;

const L=VP().map(i=>({...per(i),ix:i}));
h+=`<div class="card"><b>Semua periode</b><div class="sc" style="margin-top:8px"><table style="border-collapse:collapse;font-size:13px;white-space:nowrap"><tr><td></td>${L.map(q=>`<td style="padding:4px 8px;color:var(--mu)">${q.n.split(" – ")[0]} <button onclick="delPer(${q.ix})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:16px;cursor:pointer">×</button></td>`).join("")}</tr>`+[["Gaji",q=>q.g],["Pengeluaran",q=>sa(q.a)],["Selisih",q=>q.g+(q.x||0)-sa(q.a)],["Total aset",q=>sA(ast(q.ix).ak)]].map(r=>`<tr><td style="padding:4px 8px;color:var(--mu)">${r[0]}</td>${L.map(q=>`<td style="padding:4px 8px;text-align:right">${R(r[1](q))}</td>`).join("")}</tr>`).join("")+`</table></div><button class="btn" onclick="nextP()">+ Tambah periode berikutnya</button></div>`;
return h}
function tr(){
const q=per(pi),o=S.tx.filter(t=>t.d>=q.st&&t.d<=q.en).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
let h=`<div class="card"><b>Tambah transaksi</b><div class="f" style="margin-top:8px"><input id="d" type="date" value="${(()=>{const t=new Date().toISOString().slice(0,10);return (t<q.st||t>q.en)?q.st:t})()}"><select id="c">${CAT().map((c,i)=>dc(i)?"":`<option value="${i}">${c}</option>`).join("")}</select>
<input id="m" type="text" inputmode="numeric" placeholder="Jumlah (Rp)" oninput="fmt(this)"><select id="s">${AT().map((a,k)=>S.da.includes(k)?"":`<option value="${E(a)}">${a}</option>`).join("")}</select></div>
<input id="n" placeholder="Keterangan" style="margin-top:8px"><button class="btn" onclick="add()">Simpan</button></div>
<div class="card"><b>Periode ${q.n} (${o.length})</b><div class='note' style='margin:4px 0'>Ubah tanggal periode di bagian atas.</div>`;
o.forEach(t=>{h+=`<div class="tx"><div><div>${t.n||"-"}</div><small>${t.d.slice(8)}/${t.d.slice(5,7)} · <span class="dot" style="display:inline-block;vertical-align:middle;margin:0 5px 0 0;background:${catCol(t.c)}"></span>${CAT()[t.c]} · ${t.s}</small></div><div style="display:flex;align-items:center;gap:4px"><b>${R(t.m)}</b><button onclick="del(${t.id})" aria-label="Hapus">×</button></div></div>`});
return h+`</div>`}
function add(){const m=U(document.getElementById("m").value);if(!m)return;
S.tx.push({id:++S.nid,d:document.getElementById("d").value,c:+document.getElementById("c").value,m,s:document.getElementById("s").value,n:document.getElementById("n").value});save();draw()}
function del(id){ask("Hapus transaksi ini?",()=>{S.tx=S.tx.filter(t=>t.id!=id);save();draw()})}
function bud(){
const q=per(pi);let h=`<div class="card"><b>Anggaran ${q.n}</b><div class="note" style="margin:4px 0 10px">Ubah angka lalu keluar dari kolom untuk menyimpan. Ketuk kotak warna untuk mengganti warna kategori.</div>`;
CAT().forEach((c,i)=>{if(dc(i))return;h+=`<div class="row" style="align-items:center;margin-bottom:6px"><span style="display:flex;align-items:center;gap:8px;min-width:0"><input type="color" value="${catCol(i)}" aria-label="Warna ${E(c)}" onchange="setCol(${i},this.value)">${c}</span><input type="text" inputmode="numeric" style="width:150px" value="${R(q.b[i]||0)}" oninput="fmt(this)" onchange="setb(${pi},${i},U(this.value))"><button onclick="delCat(${i})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer">×</button></div>${(()=>{const a=q.a[i]||0,b=q.b[i]||0,pc=b?Math.min(100,a/b*100):(a?100:0),ov=b&&a>b;return `<div class="bar" style="margin:0 0 14px"><i class="${ov?"o":""}" style="width:${pc}%${ov?"":";background:"+catCol(i)}"></i></div>`})()}`});
return h+`</div><div class="card"><b>Tambah kategori</b><div class="f" style="margin-top:8px;grid-template-columns:1fr auto"><input id="cn" placeholder="Nama kategori baru"><button class="btn" style="margin:0;width:auto;padding:0 14px" onclick="addTo('cc','cn')">Tambah</button></div><div class="note">Kategori baru muncul di Transaksi dan Ringkasan. Anggarannya diatur per periode di atas.</div></div>${S.dc.length||S.da.length||S.dp.length?`<button class="btn" onclick="ask('Tampilkan lagi kategori, aset, dan periode bawaan yang sudah dihapus?',restoreAll,'Pulihkan')" style="background:var(--card);color:var(--tx);border:1px solid var(--ln)">Pulihkan yang dihapus</button>`:""}<button class="btn" onclick="ask('Nolkan semua angka: transaksi, pemasukan, gaji, anggaran, dan saldo aset? Kategori, aset, dan periode tetap ada.',zeroNums,'Nolkan')" style="background:var(--card);color:var(--tx);border:1px solid var(--ln)">Nolkan semua angka</button><button class="btn" onclick="ask('Kembalikan semua data ke awal?',resetAll,'Reset')" style="background:var(--bad)">Reset data</button>`}
function incm(){const q=per(pi);

const o=S.inc.filter(t=>t.d>=q.st&&t.d<=q.en).sort((a,b)=>b.d.localeCompare(a.d)||b.id-a.id);
const t0=new Date().toISOString().slice(0,10),d0=t0<q.st||t0>q.en?q.st:t0;
let h=`<div class="card"><b>Pemasukan ${q.n}</b><div class="grid" style="margin-top:8px"><div><div class="k">Gaji</div><input type="text" inputmode="numeric" value="${R(q.g)}" oninput="fmt(this)" onchange="setg(${pi},U(this.value))"></div><div><div class="k">Total pemasukan</div><div class="v good">${R(q.g+q.x)}</div></div></div></div><div class="card"><b>Tambah pemasukan</b><div class="f" style="margin-top:8px"><input id="iD" type="date" value="${d0}"><select id="iA">${AT().map((a,k)=>S.da.includes(k)?"":`<option value="${E(a)}">${a}</option>`).join("")}</select><input id="iM" type="text" inputmode="numeric" placeholder="Jumlah (Rp)" oninput="fmt(this)" style="grid-column:1/-1"><input id="iN" placeholder="Keterangan" style="grid-column:1/-1"></div><button class="btn" onclick="addInc()">Simpan</button></div><div class="card"><b>Riwayat (${o.length})</b>`;
o.forEach(t=>{h+=`<div class="tx"><div><div>${t.n||"-"}</div><small>${t.d.slice(8)}/${t.d.slice(5,7)} · ${t.k||"-"}</small></div><div style="display:flex;align-items:center;gap:4px"><b class="good">${R(t.m)}</b><button onclick="delInc(${t.id})" aria-label="Hapus">×</button></div></div>`});
return h+"</div>"}
function aset(){const q=per(pi),a=ast(pi);
let h=`<div class="card wide"><b>Total aset ${q.n}</b><div class="v good" style="margin:6px 0 4px">${R(sA(a.ak))}</div><div class="note">Awal ${R(sA(a.aw))} · Selisih ${R(sA(a.ak)-sA(a.aw))}</div></div>`;
AT().forEach((n,k)=>{if(S.da.includes(k))return;const d=a.ak[k]-a.aw[k];h+=`<div class="card"><div class="row"><b>${n}</b><button onclick="delAs(${k})" aria-label="Hapus" style="border:0;background:none;color:var(--mu);font-size:18px;cursor:pointer">×</button></div><div class="v good" style="margin:6px 0 10px">${R(a.ak[k])}</div><div class="row"><span class="k">Saldo awal</span><span>${R(a.aw[k])}</span></div><div class="row"><span class="k">Pemasukan</span><span class="good">+ ${R(a.inn[k])}</span></div><div class="row"><span class="k">Pengeluaran</span><span>- ${R(a.out[k])}</span></div><div class="row"><span class="k">Selisih</span><span class="${d<0?"bad":"good"}">${R(d)}</span></div><div class="row" style="align-items:center;margin-top:6px"><span class="k">Ubah saldo akhir</span><input type="text" inputmode="numeric" style="width:150px" value="${R(a.ak[k])}" oninput="fmt(this)" onchange="setA(${pi},${k},U(this.value))"></div></div>`});
h+=`<div class="note" style="margin:0 0 10px">Saldo akhir = saldo awal + pemasukan − pengeluaran dari aset yang dipilih di menu Pemasukan dan Transaksi. Mengubah saldo akhir menambahkan penyesuaian. Saldo awal otomatis dari akhir periode sebelumnya.</div><div class="card"><b>Tambah aset</b><div class="f" style="margin-top:8px;grid-template-columns:1fr auto"><input id="an" placeholder="Contoh: Reksa dana"><button class="btn" style="margin:0;width:auto;padding:0 14px" onclick="addTo('ac','an')">Tambah</button></div><div class="note">Aset baru otomatis muncul sebagai pilihan di menu Transaksi dan Pemasukan.</div></div>`;
return h}
function pbar(){const q=per(pi);return `<div class="card"><select onchange="pi=+this.value;draw()">${VP().map(i=>`<option value="${i}" ${i==pi?"selected":""}>${per(i).n}</option>`).join("")}</select><div class="f" style="margin-top:8px"><div><div class="k">Mulai</div><input type="date" value="${q.st}" onchange="setPD(${pi},'st',this.value)"></div><div><div class="k">Selesai</div><input type="date" value="${q.en}" onchange="setPD(${pi},'en',this.value)"></div></div></div>`}
function setPD(i,w,v){const p=PR(i);if(!v){draw();return}const st=w=="st"?v:p.st,en=w=="en"?v:p.en;if(st>en){ask("Tanggal mulai tidak boleh setelah tanggal selesai.",()=>{},"OK");draw();return}p[w]=v;save();draw()}
function draw(){if(S.dp.includes(pi)){const v=VP();if(v.length)pi=v[v.length-1]}nav();document.getElementById("app").innerHTML=pbar()+[ring,tr,incm,aset,bud][tab]();if(S.lang=="en"){i18n(document.getElementById("nav"));i18n(document.getElementById("app"))}applyLang()}
const TT=document.getElementById("ttl"),T0="Keuangan Saya";applySkin();applyLang();
TT.onchange=()=>{S.title=TT.value.trim();TT.value=ttl();document.title=TT.value;save()};
TT.onkeydown=e=>{if(e.key=="Enter")TT.blur()};
if(!S.z2){Object.keys(S.as).map(Number).sort((a,b)=>a-b).forEach(i=>{const old=S.as[i];delete S.as[i];const b=ast(i).ak;S.as[i]=old.map((v,k)=>(v||0)-(b[k]||0))});S.z2=1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
draw();
startSync();
accInit();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
